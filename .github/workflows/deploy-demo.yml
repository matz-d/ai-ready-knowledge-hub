name: Demo Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  IMAGE_NAME: ai-ready-knowledge-hub

jobs:
  ci:
    name: Test, Typecheck, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  deploy-demo:
    name: Deploy public demo to Cloud Run
    runs-on: ubuntu-latest
    needs: ci

    env:
      GCP_PROJECT_ID: ${{ vars.DEMO_GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.DEMO_GCP_REGION }}
      CLOUD_RUN_SERVICE: ${{ vars.DEMO_CLOUD_RUN_SERVICE || 'ai-ready-knowledge-hub-demo' }}
      ARTIFACT_REGISTRY_REPO: ${{ vars.DEMO_ARTIFACT_REGISTRY_REPO }}
      WIF_PROVIDER: ${{ vars.DEMO_WIF_PROVIDER }}
      DEPLOY_SERVICE_ACCOUNT: ${{ vars.DEMO_DEPLOY_SERVICE_ACCOUNT }}
      RUNTIME_SERVICE_ACCOUNT: ${{ vars.DEMO_RUNTIME_SERVICE_ACCOUNT }}
      KNOWLEDGE_HUB_BUCKET: ${{ vars.DEMO_KNOWLEDGE_HUB_BUCKET }}
      KNOWLEDGE_HUB_TENANT_ID: ${{ vars.DEMO_KNOWLEDGE_HUB_TENANT_ID || 'public-demo' }}
      GOOGLE_CLOUD_LOCATION: ${{ vars.DEMO_GOOGLE_CLOUD_LOCATION || 'global' }}
      DEMO_RESET_TOKEN_SECRET: ${{ vars.DEMO_RESET_TOKEN_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate demo deploy variables
        shell: bash
        env:
          PRODUCTION_GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          PRODUCTION_KNOWLEDGE_HUB_BUCKET: ${{ vars.KNOWLEDGE_HUB_BUCKET }}
        run: |
          required_vars=(
            GCP_PROJECT_ID
            GCP_REGION
            CLOUD_RUN_SERVICE
            ARTIFACT_REGISTRY_REPO
            WIF_PROVIDER
            DEPLOY_SERVICE_ACCOUNT
            RUNTIME_SERVICE_ACCOUNT
            KNOWLEDGE_HUB_BUCKET
            DEMO_RESET_TOKEN_SECRET
          )

          for var_name in "${required_vars[@]}"; do
            if [[ -z "${!var_name}" ]]; then
              echo "Missing required demo deploy value for ${var_name}. Set the corresponding DEMO_* GitHub Variable explicitly." >&2
              exit 1
            fi
          done

          if [[ -n "${PRODUCTION_GCP_PROJECT_ID}" && "${GCP_PROJECT_ID}" == "${PRODUCTION_GCP_PROJECT_ID}" ]]; then
            echo "Demo deploy must target DEMO_GCP_PROJECT_ID, not production GCP_PROJECT_ID (${PRODUCTION_GCP_PROJECT_ID})." >&2
            exit 1
          fi

          if [[ -n "${PRODUCTION_KNOWLEDGE_HUB_BUCKET}" && "${KNOWLEDGE_HUB_BUCKET}" == "${PRODUCTION_KNOWLEDGE_HUB_BUCKET}" ]]; then
            echo "Demo deploy must use DEMO_KNOWLEDGE_HUB_BUCKET, not production KNOWLEDGE_HUB_BUCKET." >&2
            exit 1
          fi

          if [[ "${CLOUD_RUN_SERVICE}" == "ai-ready-knowledge-hub" ]]; then
            echo "Demo deploy must not target the production service ai-ready-knowledge-hub." >&2
            exit 1
          fi

          if [[ "${GOOGLE_CLOUD_LOCATION}" != "global" ]]; then
            echo "GOOGLE_CLOUD_LOCATION must remain global for Gemini 3.x, got ${GOOGLE_CLOUD_LOCATION}" >&2
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker auth
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build Docker image
        id: image
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REGISTRY_REPO}/${IMAGE_NAME}"

          docker build \
            --build-arg "NEXT_PUBLIC_CONTEXT_PACKAGE_ASYNC_ENABLED=false" \
            -t "${IMAGE}:${SHORT_SHA}-demo" \
            -t "${IMAGE}:demo-latest" \
            .

          {
            echo "short_sha=${SHORT_SHA}"
            echo "image=${IMAGE}"
          } >> "${GITHUB_OUTPUT}"

      - name: Push Docker image
        run: |
          docker push "${{ steps.image.outputs.image }}:${{ steps.image.outputs.short_sha }}-demo"
          docker push "${{ steps.image.outputs.image }}:demo-latest"

      - name: Deploy public demo to Cloud Run
        id: deploy
        shell: bash
        run: |
          # Public demo uses the same Docker artifact, but runtime env disables
          # arbitrary uploads/imports and scopes reads/generation to curated samples.
          ENV_VARS=(
            "AUTH_MODE=local"
            "DEMO_MODE=true"
            "GOOGLE_CLOUD_PROJECT=${GCP_PROJECT_ID}"
            "GOOGLE_CLOUD_LOCATION=${GOOGLE_CLOUD_LOCATION}"
            "KNOWLEDGE_HUB_BUCKET=${KNOWLEDGE_HUB_BUCKET}"
            "KNOWLEDGE_HUB_TENANT_ID=${KNOWLEDGE_HUB_TENANT_ID}"
            "MASKER_PROVIDER=cloud-dlp"
            "FIRESTORE_PREFER_REST=false"
          )

          ENV_CSV="$(IFS=,; echo "${ENV_VARS[*]}")"
          SECRET_VARS=("DEMO_RESET_TOKEN=${DEMO_RESET_TOKEN_SECRET}:latest")
          SECRET_CSV="$(IFS=,; echo "${SECRET_VARS[*]}")"

          gcloud run deploy "${CLOUD_RUN_SERVICE}" \
            --image="${{ steps.image.outputs.image }}:${{ steps.image.outputs.short_sha }}-demo" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --service-account="${RUNTIME_SERVICE_ACCOUNT}" \
            --timeout=600 \
            --max-instances=2 \
            --no-invoker-iam-check \
            --set-env-vars="${ENV_CSV}" \
            --set-secrets="${SECRET_CSV}" \
            --quiet

          service_url="$(gcloud run services describe "${CLOUD_RUN_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --format='value(status.url)')"
          echo "service_url=${service_url}" >> "${GITHUB_OUTPUT}"

      - name: Verify public demo URL
        shell: bash
        run: |
          service_url="${{ steps.deploy.outputs.service_url }}"
          if [[ -z "${service_url}" ]]; then
            echo "Missing deployed service URL." >&2
            exit 1
          fi

          status="$(curl -sS -o /tmp/demo-home.html -w '%{http_code}' "${service_url}/")"
          if [[ "${status}" != "200" ]]; then
            echo "Expected public demo URL to return 200, got ${status}" >&2
            sed -n '1,80p' /tmp/demo-home.html >&2
            exit 1
          fi

          echo "Public demo URL: ${service_url}"
